# 3-node Apache Cassandra cluster for the CS 5614 topic demo.
#
# Start:   docker compose up -d
# Check:   docker exec cass1 nodetool status      (wait for 3 x "UN")
# Shell:   docker exec -it cass1 cqlsh
# Reset:   docker compose down -v                 (deletes all data)
#
# Nodes start one after another (cass1 -> cass2 -> cass3). Cassandra nodes that
# bootstrap at the same time can fail to join, so each waits for the previous
# node's health check.

x-cassandra: &cassandra
  image: cassandra:5.0
  restart: "no"
  environment: &cassandra-env
    CASSANDRA_CLUSTER_NAME: demo
    CASSANDRA_SEEDS: cass1
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    CASSANDRA_DC: dc1
    CASSANDRA_RACK: rack1
    # Cap memory so three nodes fit on a laptop (about 6 GB for Docker).
    # Cassandra requires these two to be set together.
    MAX_HEAP_SIZE: 512M
    HEAP_NEWSIZE: 128M
  healthcheck:
    test: ["CMD-SHELL", "nodetool status 2>/dev/null | grep -E '^UN\\s+'$(hostname -i) || exit 1"]
    interval: 20s
    timeout: 15s
    retries: 30
    start_period: 60s

services:
  cass1:
    <<: *cassandra
    container_name: cass1
    hostname: cass1
    ports:
      - "9042:9042"   # CQL port, exposed only one node

  cass2:
    <<: *cassandra
    container_name: cass2
    hostname: cass2
    depends_on:
      cass1:
        condition: service_healthy

  cass3:
    <<: *cassandra
    container_name: cass3
    hostname: cass3
    depends_on:
      cass2:
        condition: service_healthy